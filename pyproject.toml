[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-converter-toolkit"
version = "4.2.0"
description = "Markdown / Word / PDF 互转桌面应用与命令行工具"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.5.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
format-converter = "format_converter.cli:main"

[tool.setuptools.packages.find]
include = ["format_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
